name: Deploy to GitHub Pages

# Карта раздаётся статикой с GitHub Pages по адресу
# https://igordikinov.github.io/process-map/ и встраивается оттуда в iframe.
# Публикуется только собранный dist/ — исходники, презентация и макет
# остаются в репозитории, но сайтом не раздаются.
#
# ВЕРСИИ ACTIONS (process-map-vjz.9). Раннеры перешли на Node 24, а 23.09.2026
# Node 20 удаляется из образа совсем — прежние v4/v3 не предупреждали бы, а
# ломались. Версии подняты по полю runs.using в манифесте тега, а не по release
# notes: у upload-artifact заявленная в v5 поддержка Node 24 на деле осталась
# node20, минимум там v6. Предупреждение про upload-artifact в job build
# приходило не отсюда — этот шаг лежит внутри upload-pages-artifact, и её v3 и
# v4 обе тянут node20-версию, поэтому нужна ровно v5.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Разрешения нужны именно этому workflow: read для checkout,
# pages+id-token — для официального деплоя через actions/deploy-pages,
# actions: read — его же требование начиная с v4 (process-map-vjz.9).
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: побеждает последний push в main.
# cancel-in-progress: false — начатый деплой доводится до конца,
# чтобы Pages не остался с полузалитой сборкой.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Версия из .nvmrc: npm run layout требует Node >= 22.6
      # (node --experimental-strip-types), см. engines в package.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Сломанная сборка не должна попасть на Pages: сначала проверки.
      # npm run check это tsc + eslint + vitest + prettier --check
      # (process-map-mx2). e2e гоняются соседним job'ом e2e: им нужны браузеры
      # Playwright, и ставить их ради сборки незачем — job'ы идут параллельно.
      - run: npm run check

      - run: npm run build

      # base: './' в vite.config.ts (SPEC §6) делает пути относительными,
      # поэтому сборка работает из подкаталога /process-map/ без правок.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Задача process-map-vjz.3. До неё e2e не запускались в CI вовсе, и флак
  # process-map-6ja месяц падал в половине локальных прогонов, ни разу не
  # будучи пойманным pipeline.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Только chromium: в playwright.config.ts нет projects, то есть работает
      # единственный неявный проект. Установка без имени браузера тянула бы
      # ещё firefox и webkit впустую.
      - run: npx playwright install --with-deps chromium

      # Dev-сервер поднимает сам Playwright (webServer в конфиге) — отдельного
      # шага здесь быть не должно: в CI reuseExistingServer=false, и на занятом
      # порту прогон упал бы с «is already used».
      - run: npm run e2e

      # Без этого от падения в CI осталась бы только текстовая простыня лога:
      # трейс и HTML-отчёт пишутся в файлы. if: !cancelled() — отчёт нужен
      # именно когда прогон красный.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    # Решение владельца: e2e блокируют деплой — сломанное не уезжает на стенд.
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
